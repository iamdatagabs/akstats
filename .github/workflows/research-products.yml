name: Build research products

on:
  workflow_dispatch:
  push:
    branches: [main, "engineering/**"]
    paths:
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/research-products.yml"

permissions:
  contents: read

jobs:
  build-products:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Run analysis and export products
        run: akstats
      - name: Upload research products
        uses: actions/upload-artifact@v4
        with:
          name: AKStats-research-products
          path: |
            outputs/
            data/processed/
          if-no-files-found: error
          retention-days: 30
