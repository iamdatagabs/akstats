name: Publish research portal
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "data/raw/**"
      - "docs/**"
      - "scripts/build_pages_data.py"
      - "pyproject.toml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install analysis package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Generate research products
        run: akstats
      - name: Prepare dashboard data
        run: python scripts/build_pages_data.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
