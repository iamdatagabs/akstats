[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "akstats"
version = "0.1.0"
description = "Exploratory analysis of the ARID2-MAPK axis in AK and cSCC."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Gabriel Passos de Jesus" }]
dependencies = ["pandas>=2.1,<3.0", "numpy>=1.26,<3.0", "scipy>=1.11", "statsmodels>=0.14", "matplotlib>=3.8", "seaborn>=0.13", "openpyxl>=3.1", "requests>=2.31", "markdown>=3.6", "tabulate>=0.9"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
akstats = "akstats.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
